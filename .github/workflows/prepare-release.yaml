name: prepare-release

on:
    workflow_dispatch:
        inputs:
            bump:
                description: "Version bump type"
                required: true
                type: choice
                options:
                    - patch
                    - minor
                    - major
            dry_run:
                description: "Run without pushing a branch or pull request"
                required: false
                type: boolean
                default: false

permissions:
    contents: write
    pull-requests: write

jobs:
    prepare-release:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout master
              uses: actions/checkout@v4
              with:
                  ref: master
                  fetch-depth: 0
                  token: ${{ secrets.GH_PAT }}

            - name: Fetch tags
              run: git fetch --tags --force

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "18"

            - name: Compute next version
              id: version
              shell: bash
              env:
                  BUMP: ${{ inputs.bump }}
              run: |
                  set -euo pipefail

                  LAST_TAG="$(git tag --list 'v*' | sort -V | tail -n1 || true)"
                  if [ -z "$LAST_TAG" ]; then
                    BASE="$(node -p "require('./package.json').version")"
                  else
                    BASE="${LAST_TAG#v}"
                  fi

                  IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"

                  case "$BUMP" in
                    major)
                      MAJOR=$((MAJOR + 1))
                      MINOR=0
                      PATCH=0
                      ;;
                    minor)
                      MINOR=$((MINOR + 1))
                      PATCH=0
                      ;;
                    patch)
                      PATCH=$((PATCH + 1))
                      ;;
                    *)
                      echo "Invalid bump type: $BUMP" >&2
                      exit 1
                      ;;
                  esac

                  NEXT="${MAJOR}.${MINOR}.${PATCH}"
                  TAG="v${NEXT}"

                  npm version "$NEXT" --no-git-tag-version

                  echo "version=$NEXT" >> "$GITHUB_OUTPUT"
                  echo "tag=$TAG" >> "$GITHUB_OUTPUT"

            - name: Stop if tag already exists
              shell: bash
              env:
                  TAG: ${{ steps.version.outputs.tag }}
              run: |
                  set -euo pipefail
                  if git rev-parse "$TAG" >/dev/null 2>&1; then
                    echo "Tag $TAG already exists." >&2
                    exit 1
                  fi

            - name: Stop if release branch already exists
              shell: bash
              env:
                  TAG: ${{ steps.version.outputs.tag }}
              run: |
                  set -euo pipefail
                  BRANCH="release/$TAG"
                  if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
                    echo "Release branch $BRANCH already exists." >&2
                    exit 1
                  fi

            - name: Prepare CHANGELOG.md
              shell: bash
              env:
                  TAG: ${{ steps.version.outputs.tag }}
              run: node scripts/prepare-changelog.mjs "$TAG"

            - name: Show dry run result
              if: ${{ inputs.dry_run }}
              shell: bash
              run: |
                  echo "Dry run enabled. No branch or pull request will be pushed."
                  echo "Next version: ${{ steps.version.outputs.tag }}"
                  git diff -- CHANGELOG.md package.json package-lock.json

            - name: Create release branch
              if: ${{ !inputs.dry_run }}
              id: branch
              shell: bash
              env:
                  TAG: ${{ steps.version.outputs.tag }}
              run: |
                  set -euo pipefail
                  BRANCH="release/$TAG"
                  git checkout -b "$BRANCH"
                  echo "name=$BRANCH" >> "$GITHUB_OUTPUT"

            - name: Commit release metadata
              if: ${{ !inputs.dry_run }}
              shell: bash
              env:
                  TAG: ${{ steps.version.outputs.tag }}
              run: |
                  set -euo pipefail
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add CHANGELOG.md package.json package-lock.json
                  git commit -m "chore: prepare $TAG release"

            - name: Push release branch
              if: ${{ !inputs.dry_run }}
              env:
                  BRANCH: ${{ steps.branch.outputs.name }}
              run: git push origin "$BRANCH"

            - name: Open PR to stable
              if: ${{ !inputs.dry_run }}
              env:
                  GH_TOKEN: ${{ secrets.GH_PAT }}
                  TAG: ${{ steps.version.outputs.tag }}
                  BRANCH: ${{ steps.branch.outputs.name }}
              run: |
                  gh pr create \
                    --title "chore: prepare $TAG release" \
                    --body "Updates the package version and changelog for $TAG. Review the changelog, then merge this PR into stable to publish the release." \
                    --head "$BRANCH" \
                    --base stable
