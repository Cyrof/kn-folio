name: ci

on:
    pull_request:
        branches: [master]
    push:
        branches: [master]

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "18"
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Build Next.js app
              run: npm run build

    docker-build:
        runs-on: ubuntu-latest
        needs: build

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Build Docker image
              run: docker build -t kn-folio:test .
