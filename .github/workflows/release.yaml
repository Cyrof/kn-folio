name: release

on:
    pull_request:
        branches: [stable]
        types: [closed]
    workflow_dispatch:

permissions:
    contents: write
    packages: write

env:
    IMAGE_NAME: ghcr.io/cyrof/kn-folio

jobs:
    guard:
        runs-on: ubuntu-latest
        outputs:
            ok: ${{ steps.check.outputs.ok }}
        steps:
            - name: Check trigger
              id: check
              shell: bash
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  PR_MERGED: ${{ github.event.pull_request.merged }}
                  PR_BASE: ${{ github.event.pull_request.base.ref }}
                  PR_HEAD: ${{ github.event.pull_request.head.ref }}
              run: |
                  set -euo pipefail

                  if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
                    echo "ok=true" >> "$GITHUB_OUTPUT"
                  elif [ "$EVENT_NAME" = "pull_request" ] && \
                       [ "$PR_MERGED" = "true" ] && \
                       [ "$PR_BASE" = "stable" ] && \
                       [[ "$PR_HEAD" == release/* ]]; then
                    echo "ok=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "ok=false" >> "$GITHUB_OUTPUT"
                  fi

    release:
        needs: guard
        if: ${{ needs.guard.outputs.ok == 'true' }}
        runs-on: ubuntu-latest
        steps:
            - name: Checkout stable
              uses: actions/checkout@v4
              with:
                  ref: stable
                  fetch-depth: 0

            - name: Fetch tags
              run: git fetch --tags --force

            - name: Parse version from CHANGELOG.md
              id: version
              shell: bash
              run: |
                  set -euo pipefail
                  VERSION="$(grep -m1 -E '^## \[v?[0-9]+\.[0-9]+\.[0-9]+\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$' CHANGELOG.md \
                    | sed -E 's/^## \[v?([^]]+)\].*/\1/')"
                  if [ -z "$VERSION" ]; then
                    echo "Could not parse a release version from CHANGELOG.md." >&2
                    exit 1
                  fi
                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"
                  echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

            - name: Check if tag already exists
              id: tagcheck
              shell: bash
              env:
                  TAG: ${{ steps.version.outputs.tag }}
              run: |
                  set -euo pipefail
                  if git rev-parse "$TAG" >/dev/null 2>&1; then
                    echo "exists=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "exists=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: Extract release notes
              id: notes
              shell: bash
              env:
                  VERSION: ${{ steps.version.outputs.version }}
                  TAG: ${{ steps.version.outputs.tag }}
              run: |
                  set -euo pipefail
                  BODY_FILE="/tmp/kn_folio_release_body.md"
                  NOTES="$(awk -v ver="## [$VERSION]" -v ver2="## [v$VERSION]" '
                    $0 ~ "^## \\[" { in_section=0 }
                    index($0, ver) == 1 || index($0, ver2) == 1 { in_section=1; next }
                    in_section { print }
                  ' CHANGELOG.md | sed -e '1{/^$/d}')"
                  if [ -z "$NOTES" ] || [[ "$NOTES" == *"(fill)"* ]]; then
                    echo "Add release notes under $TAG in CHANGELOG.md before publishing." >&2
                    exit 1
                  fi
                  printf '%s\n' "$NOTES" > "$BODY_FILE"
                  cat >> "$BODY_FILE" <<EOF

                  ---

                  ## Container Image

                  - $IMAGE_NAME:$TAG
                  - $IMAGE_NAME:latest
                  EOF
                  echo "body_path=$BODY_FILE" >> "$GITHUB_OUTPUT"

            - name: Create annotated tag
              if: steps.tagcheck.outputs.exists != 'true'
              shell: bash
              env:
                  TAG: ${{ steps.version.outputs.tag }}
              run: |
                  set -euo pipefail
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git tag -a "$TAG" -m "Release $TAG"
                  git push origin "$TAG"

            - name: Check if GitHub Release exists
              id: releasecheck
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ steps.version.outputs.tag }}
              run: |
                  if gh release view "$TAG" >/dev/null 2>&1; then
                    echo "exists=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "exists=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: Create GitHub Release
              if: steps.releasecheck.outputs.exists != 'true'
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ steps.version.outputs.tag }}
                  name: ${{ steps.version.outputs.tag }}
                  body_path: ${{ steps.notes.outputs.body_path }}
                  draft: false
                  prerelease: false

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v3

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Login to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Docker metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.IMAGE_NAME }}
                  tags: |
                      type=raw,value=${{ steps.version.outputs.tag }}
                      type=raw,value=latest

            - name: Build and push Docker image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ./Dockerfile
                  push: true
                  platforms: linux/amd64,linux/arm64,linux/arm/v7
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
